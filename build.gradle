import org.gradle.internal.os.OperatingSystem

def isWindows = OperatingSystem.current().isWindows()

def pythonExecutable = isWindows ? 'py' : 'python3'
def pythonArgs = isWindows ? ['-3'] : []

def bashExecutable = null
if (isWindows) {
    bashExecutable = [
        'C:/Program Files/Git/bin/bash.exe',
        'C:/Program Files/Git/usr/bin/bash.exe',
        'C:/Program Files (x86)/Git/bin/bash.exe',
        'C:/Program Files (x86)/Git/usr/bin/bash.exe'
    ].find { file(it).exists() }
} else {
    bashExecutable = 'bash'
}

tasks.register('validateMixinConfig', Exec) {
    description = 'Validates mixin registration, exclusions, and configuration'
    group = 'verification'

    onlyIf {
        file('scripts/validate_mixin_config.py').exists()
    }

    executable = pythonExecutable
    args = pythonArgs + ['scripts/validate_mixin_config.py']
}

tasks.register('validateMixinSignatures', Exec) {
    description = 'Validates @Inject/@Shadow targets against Minecraft source'
    group = 'verification'

    onlyIf {
        file('scripts/validate_mixin_targets.py').exists() &&
        file('.reference/minecraft/1.21.1/decompiled').exists()
    }

    ignoreExitValue = true
    executable = pythonExecutable
    args = pythonArgs + ['scripts/validate_mixin_targets.py']
}

if (bashExecutable != null) {
    tasks.register('validateMixins', Exec) {
        dependsOn jar
        description = 'Validates that all mixins declared in JSON configs are present in the JAR'
        group = 'verification'

        onlyIf {
            file('scripts/validate_mixins.sh').exists()
        }

        executable = bashExecutable
        args = ['scripts/validate_mixins.sh']
    }
} else {
    tasks.register('validateMixins') {
        dependsOn jar
        description = 'Skipped because bash.exe was not found'
        group = 'verification'

        doLast {
            logger.warn('Skipping validateMixins. Install Git for Windows or WSL to enable the shell validation script.')
        }
    }
}